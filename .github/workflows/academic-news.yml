name: 🎓 Artigo Acadêmico e Profissional

on:
  schedule:
    # Dias alternados às 13h BRT (16h UTC) → ~15 execuções/mês
    - cron: '0 16 */2 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm ci

      - name: Gerar artigo acadêmico/profissional
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/academic-news.js

      - name: Commit e push
        run: |
          git config user.name  "academic-news-bot"
          git config user.email "bot@empresasenegocios.com.br"
          git pull --no-rebase origin main
          git add -A
          git diff --staged --quiet \
            || git commit -m "feat: artigo acadêmico/profissional $(date +'%Y-%m-%d') [skip ci]"
          git push
